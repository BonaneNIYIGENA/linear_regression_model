[project]
name = "schooling-expenditure-regression"
version = "0.1.0"
description = "Predicting individual schooling expenditure in Rwanda (EICV7 2023-24) with regression models, served via FastAPI."
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false
