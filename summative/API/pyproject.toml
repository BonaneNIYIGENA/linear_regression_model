[project]
name = "schooling-expenditure-api"
version = "0.1.0"
description = "FastAPI service that serves the schooling expenditure model on Render"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.164.0",
    "joblib==1.6.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "python-multipart==0.0.34",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
